<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z-IPTV Player · Privacy policy</title>
<meta name="description" content="Privacy policy of the Z-IPTV Player TV app.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var r = document.documentElement, t, l;
    try { t = JSON.parse(localStorage.getItem('ziptv-site.theme')); } catch (e) {}
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
    try { l = JSON.parse(localStorage.getItem('ziptv-site.lang')); } catch (e) {}
    if (l === 'he' || l === 'ar') { r.lang = l; r.dir = 'rtl'; }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&text=Zuhier%20Farah&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="./"><img src="icon.svg" alt="">Z-IPTV Player</a>
  <select id="lang"><option value="en">English</option><option value="he">עברית</option><option value="ar">العربية</option></select>
  <button id="theme" class="icon-btn" type="button"></button>
</header>
<main class="policy">
  <h1 id="ptitle"></h1>
  <p class="updated" id="pupdated"></p>
  <div id="pbody"></div>
</main>
</div>
<footer class="credit"><span class="credit-rule" aria-hidden="true"></span><span class="credit-label" data-t="madeBy">Made by</span><span class="signature" dir="ltr">Zuhier Farah</span><span class="credit-year" id="year"></span></footer>
<script src="privacy.js"></script>
<script>
  // Fills the policy for the chosen language (site.js calls this on every language change).
  window.onSiteRender = function (lang) {
    var doc = Z.PRIVACY[lang] || Z.PRIVACY.en;
    document.title = 'Z-IPTV Player · ' + doc.title;
    document.getElementById('ptitle').textContent = doc.title;
    document.getElementById('pupdated').textContent = doc.updated + ': ' + new Date(Z.PRIVACY.updated + 'T12:00:00').toLocaleDateString(lang === 'ar' ? 'ar-u-nu-latn' : lang, { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('pbody').innerHTML = Z.privacyHtml(lang);
  };
</script>
<script src="site.js"></script>
</body>
</html>
